[project]
name = "isv"
version = "0.0.1"
description = "Automated Interpretation of Structural Copy Number Variants"
readme = "README.md"
requires-python = ">=3.14"
authors = [
	{name = "Tomas Sladecek", email = "tomas.sladecek@geneton.sk" },
]
license-files = ["LICENSE.txt"]
dependencies = [
    "numba>=0.65.0",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "plotly>=6.6.0",
    "shap>=0.49.1",
    "xgboost>=3.2.0",
]

[project.urls]
Homepage = "https://github.com/tsladecek/isv_package"

[project.scripts]
isv = "isv.main:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["src/isv/models/**", "src/isv/data/**"]
